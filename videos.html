<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Red Wings — Videos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  :root{--panel-top:#1a1f4d;--panel-bottom:#0a0e2e;--border-outer:#f5e6b8;--border-inner:#8a6d2f;--text-main:#f4f0e2;--text-dim:#a9a7c9;--accent-gold:#f0c85a;--divider:#3a3f7a}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#05061a;background-image:radial-gradient(ellipse at 20% 10%,rgba(60,50,120,.5),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(30,60,90,.4),transparent 60%);font-family:'VT323',monospace;color:var(--text-main);padding:24px}
  .frame{width:100%;max-width:820px;margin:0 auto}
  .back-link{display:inline-block;color:var(--text-dim);text-decoration:none;font-size:16px;margin-bottom:14px;border-bottom:1px solid transparent}
  .back-link:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold)}
  .campaign-title{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:1px;color:var(--accent-gold);text-align:center;margin:0 0 18px;text-shadow:2px 2px 0 #000}
  .campaign-sub{text-align:center;color:var(--text-dim);font-size:16px;margin:-14px 0 20px}
  .panel{border:3px solid var(--border-outer);outline:3px solid var(--border-inner);outline-offset:-6px;border-radius:4px;background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom));box-shadow:0 0 0 6px #000,0 20px 40px rgba(0,0,0,.6);padding:18px}
  .video-list{display:flex;flex-direction:column;gap:12px}
  .video-card{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--divider);border-radius:4px;background:rgba(255,255,255,.02);text-decoration:none;color:inherit;transition:background .12s ease,border-color .12s ease,transform .1s ease}
  .video-card:hover,.video-card:focus-visible{border-color:var(--accent-gold);background:rgba(240,200,90,.08);outline:none;transform:translateY(-2px)}
  .play{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent-gold);display:flex;align-items:center;justify-content:center}
  .play::before{content:"";margin-left:4px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid var(--accent-gold)}
  .video-info{flex:1;min-width:0}
  .video-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .video-title{font-size:19px}
  .video-tag{font-size:12px;color:var(--text-dim);border:1px solid var(--divider);border-radius:3px;padding:1px 7px}
  .video-desc{font-size:16px;line-height:1.4;color:var(--text-dim);margin-top:3px}
  .arrow{flex:none;color:var(--text-dim);font-size:20px}
  .video-card:hover .arrow{color:var(--accent-gold)}
  footer{text-align:center;color:var(--text-dim);font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="frame">
  <a class="back-link" href="index.html">&larr; Back to Party</a>
  <h1 class="campaign-title">Red Wings</h1>
  <p class="campaign-sub">— Videos —</p>

  <!--
    ADD A VIDEO:
      Copy one whole <a class="video-card">...</a> block, paste it into the
      list below, then change:
        - href  -> the HTML page that plays your video, e.g.
                   videos/session-1.html (keep those pages in a "videos"
                   folder next to this file), or a full web address
                   (https://...) if it lives somewhere else.
        - the title, the small tag (session number, "Recap", "Lore"... or
          delete the tag <span>), and the description.
      Newest first is a good habit: paste new videos at the top.

    REMOVE A VIDEO:
      Delete its whole <a class="video-card">...</a> block.

    Pages open in a new tab, so players don't lose this page and your video
    pages don't need their own "back" link.
  -->

  <div class="panel">
    <div class="video-list">

      


    </div>
  </div>

  <footer>This page is edited directly in the file — ask your DM to add new videos.</footer>
</div>
</body>
</html>
