<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Red Wings — Notable NPCs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root{
    --panel-top:#1a1f4d;
    --panel-bottom:#0a0e2e;
    --border-outer:#f5e6b8;
    --border-inner:#8a6d2f;
    --text-main:#f4f0e2;
    --text-dim:#a9a7c9;
    --accent-gold:#f0c85a;
    --divider:#3a3f7a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:#05061a;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(60,50,120,0.5), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(30,60,90,0.4), transparent 60%);
    font-family:'VT323', monospace;
    color:var(--text-main);
    padding:24px;
  }

  .frame{ width:100%; max-width:820px; margin:0 auto; }

  .back-link{
    display:inline-block;
    color:var(--text-dim);
    text-decoration:none;
    font-size:16px;
    margin-bottom:14px;
    border-bottom:1px solid transparent;
  }
  .back-link:hover{ color:var(--accent-gold); border-bottom-color:var(--accent-gold); }

  .campaign-title{
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    letter-spacing:1px;
    color:var(--accent-gold);
    text-align:center;
    margin:0 0 18px;
    text-shadow:2px 2px 0 #000;
  }

  .campaign-sub{
    text-align:center;
    color:var(--text-dim);
    font-size:16px;
    margin:-14px 0 20px;
  }

  .panel{
    border:3px solid var(--border-outer);
    outline:3px solid var(--border-inner);
    outline-offset:-6px;
    border-radius:4px;
    background:linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    box-shadow:0 0 0 6px #000, 0 20px 40px rgba(0,0,0,0.6);
    padding:18px;
  }

  .npc-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .npc-card{
    display:flex;
    gap:14px;
    padding:12px 14px;
    border:1px solid var(--divider);
    border-radius:4px;
    background:rgba(255,255,255,0.02);
  }

  .portrait{
    width:56px;
    height:56px;
    flex:none;
    border-radius:50%;
    border:2px solid var(--accent-gold);
    overflow:hidden;
    background:radial-gradient(circle at 35% 30%, #4a4f9e, #1c2050);
  }
  .portrait img{ width:100%; height:100%; object-fit:cover; display:block; }

  .npc-info{ flex:1; min-width:0; }

  .npc-name-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }

  .npc-name{ font-size:19px; color:var(--text-main); }

  .npc-tag{
    font-size:12px;
    color:var(--accent-gold);
    border:1px solid var(--accent-gold);
    border-radius:3px;
    padding:1px 7px;
    letter-spacing:0.5px;
  }

  .npc-role{
    font-size:14px;
    color:var(--text-dim);
    margin-top:2px;
  }

  .npc-desc{
    font-size:16px;
    line-height:1.45;
    margin-top:6px;
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    margin-top:16px;
  }
</style>
</head>
<body>
<div class="frame">
  <a class="back-link" href="index.html">&larr; Back to Party</a>
  <h1 class="campaign-title">Red Wings</h1>
  <p class="campaign-sub">— Notable NPCs —</p>

  <!--
    HOW TO EDIT THIS PAGE:

    ADD AN NPC:
      Copy one whole <div class="npc-card">...</div> block and paste it
      anywhere inside .npc-list. Edit the name, tag (ally/rival/neutral/
      unknown — or remove the <span class="npc-tag"> entirely), role,
      and description. If you have a portrait image, point the <img>
      src at it (see the images/ folder); otherwise you can delete the
      whole .portrait div and the info will just start flush left.

    REMOVE AN NPC:
      Delete its whole <div class="npc-card">...</div> block.
  -->

  <div class="panel">
    <div class="npc-list">

      <div class="npc-card">
        <div class="portrait"><img src="images/npc-placeholder.png" alt="Portrait" onerror="this.parentElement.style.display='none'"></div>
        <div class="npc-info">
          <div class="npc-name-row">
            <span class="npc-name">Name</span>
            <span class="npc-tag">Ally</span>
          </div>
          <div class="npc-role">Role or title · Where they're found</div>
          <div class="npc-desc">A short description — who they are, how the party met them, and anything useful to remember about them.</div>
        </div>
      </div>

    </div>
  </div>

  <footer>This page is edited directly in the file — ask your DM to add new NPCs.</footer>
</div>
</body>
</html>
