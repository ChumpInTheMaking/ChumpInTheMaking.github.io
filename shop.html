<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Red Wings — Magic Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  :root{--panel-top:#1a1f4d;--panel-bottom:#0a0e2e;--border-outer:#f5e6b8;--border-inner:#8a6d2f;--text-main:#f4f0e2;--text-dim:#a9a7c9;--accent-gold:#f0c85a;--divider:#3a3f7a;
    --r-common:#a9a7c9;--r-uncommon:#7fd858;--r-rare:#7ec4e8;--r-veryrare:#c9a6f5;--r-legendary:#f0a040;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#05061a;background-image:radial-gradient(ellipse at 20% 10%,rgba(60,50,120,.5),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(30,60,90,.4),transparent 60%);font-family:'VT323',monospace;color:var(--text-main);padding:24px}
  .frame{width:100%;max-width:820px;margin:0 auto}
  .back-link{display:inline-block;color:var(--text-dim);text-decoration:none;font-size:16px;margin-bottom:14px;border-bottom:1px solid transparent}
  .back-link:hover{color:var(--accent-gold);border-bottom-color:var(--accent-gold)}
  .campaign-title{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:1px;color:var(--accent-gold);text-align:center;margin:0 0 18px;text-shadow:2px 2px 0 #000}
  .campaign-sub{text-align:center;color:var(--text-dim);font-size:16px;margin:-14px 0 20px}
  .panel{border:3px solid var(--border-outer);outline:3px solid var(--border-inner);outline-offset:-6px;border-radius:4px;background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom));box-shadow:0 0 0 6px #000,0 20px 40px rgba(0,0,0,.6);padding:18px 20px;margin-bottom:22px}
  .shop-header{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--divider)}
  .shop-name{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--accent-gold);margin-bottom:8px}
  .shop-meta{font-size:16px;color:var(--text-dim)}
  .item-list{display:flex;flex-direction:column;gap:10px}
  .item-card{padding:10px 14px;border:1px solid var(--divider);border-radius:4px;background:rgba(255,255,255,.02)}
  .item-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .item-name-wrap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
  .item-name{font-size:19px}
  .tag{font-size:12px;border:1px solid currentColor;border-radius:3px;padding:1px 7px;letter-spacing:.5px;color:var(--text-dim)}
  .tag.Common{color:var(--r-common)}.tag.Uncommon{color:var(--r-uncommon)}.tag.Rare{color:var(--r-rare)}.tag.Very{color:var(--r-veryrare)}.tag.Legendary{color:var(--r-legendary)}
  .tag.type{border-color:var(--divider)}
  .item-price{flex:none;white-space:nowrap;font-size:19px;color:var(--accent-gold)}
  .item-desc{font-size:16px;line-height:1.4;color:var(--text-dim);margin-top:4px}
  .item-card.sold{opacity:.5}.item-card.sold .item-price{text-decoration:line-through}
  .item-card.sold .item-name::after{content:"  SOLD OUT";font-size:12px;color:var(--text-dim)}
  .note,footer{text-align:center;color:var(--text-dim);font-size:14px;margin-top:12px}
  /* DM workbench */
  #dm{display:none}.dm-on #dm{display:block}
  #dm h3{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--accent-gold);margin:16px 0 8px}
  #dm h3:first-child{margin-top:0}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  #dm input,#dm select,#dm textarea,#dm button{font-family:'VT323',monospace;font-size:16px;background:#10143a;color:var(--text-main);border:1px solid var(--divider);border-radius:3px;padding:5px 8px}
  #dm input:focus,#dm select:focus,#dm textarea:focus{outline:none;border-color:var(--accent-gold)}
  #dm button{cursor:pointer;background:var(--accent-gold);color:#1a1200;border:none}
  #dm button.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--divider)}
  #dm input[type=number]{width:64px}.grow{flex:1;min-width:120px}
  #dm textarea{width:100%;height:170px;font-size:14px}
  .warn{color:#e0a07a;font-size:14px}
  .hint{color:var(--text-dim);font-size:14px;margin:4px 0}
</style>
</head>

    const o = { id: slug(W.name), name: W.name, city: W.city, seed: W.seed,
      roll: W.roll.filter(r => r.count > 0).map(r => { const x = {count:r.count}; if (r.rarity) x.rarity = r.rarity; if (r.type) x.type = r.type; return x; }),
      guarantee: W.guarantee.filter(g => (typeof g === "string" ? g : g.name)).map(g => { if (typeof g === "string") return g; const x = {name:g.name}; ["price","rarity","type","desc"].forEach(k => { if (g[k] !== undefined && g[k] !== "") x[k] = g[k]; }); return Object.keys(x).length === 1 ? x.name : x; }),
      sold: W.sold || [] };
    return o;
  };
  const refresh = () => {
    const c = clean();
    document.getElementById("out").value = JSON.stringify(c, null, 2);
    document.getElementById("idout").textContent = '"' + c.id + '"';
    W.items = renderShop(c, true);
  };
  const fill = () => { dm.querySelectorAll("[data-top]").forEach(el => el.value = W[el.dataset.top] || ""); rows(); refresh(); };
  fill();

  dm.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.top) W[t.dataset.top] = t.value;
    else if (t.dataset.l){
      const list = W[t.dataset.l], i = +t.dataset.i, f = t.dataset.f;
      if (t.dataset.l === "guarantee" && typeof list[i] === "string") list[i] = {name:list[i]};
      let v = t.value;
      if (f === "count") v = parseInt(v) || 0;
      if (f === "price") v = v === "" ? undefined : Number(v);
      if (v === "" || v === undefined) delete list[i][f]; else list[i][f] = v;
      if (t.dataset.l === "guarantee" && (f === "name" || f === "rarity")) dm.querySelector('[data-warn="' + i + '"]').textContent = warnText(list[i]);
    } else return;
    refresh();
  });
  dm.addEventListener("click", e => {
    const t = e.target;
    if (t.id === "reroll"){ W.seed = newSeed(); fill(); }
    else if (t.id === "addroll"){ W.roll.push({count:1}); rows(); refresh(); }
    else if (t.id === "addg"){ W.guarantee.push({name:""}); rows(); refresh(); }
    else if (t.dataset.del){ W[t.dataset.del].splice(+t.dataset.i, 1); rows(); refresh(); }
    else if (t.id === "copy"){ const ta = document.getElementById("out"); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => document.getElementById("copied").textContent = "Copied!").catch(() => { document.execCommand("copy"); document.getElementById("copied").textContent = "Copied!"; }); }
  });
  dm.addEventListener("change", e => { if (e.target.id === "pick"){ load(e.target.value); fill(); } });
  document.getElementById("shop").addEventListener("click", e => {
    const card = e.target.closest("[data-sold]"); if (!card) return;
    const name = W.items[+card.dataset.sold].name, k = norm(name);
    W.sold = W.sold || [];
    const idx = W.sold.findIndex(x => norm(x) === k);
    if (idx >= 0) W.sold.splice(idx, 1); else W.sold.push(name);
    refresh();
  });
}
</script>
</body>
</html>
